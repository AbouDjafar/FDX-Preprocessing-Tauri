<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#193a35" />
    <meta name="description" content="FDX Atelier, préparation et vérification locale des classeurs de marchés publics." />
    <title>FDX Atelier</title>
    <style>
      html,body{margin:0;min-height:100%;background:#f5f2e9;color:#203b36;font-family:system-ui,sans-serif;letter-spacing:0}
      #startup{max-width:36rem;margin:12vh auto;padding:2rem;border-top:4px solid #d4aa62;line-height:1.6}
      #startup h1{font-family:Georgia,serif;font-size:2rem;font-weight:500}#startup p{color:#53675e}
      #startup a{display:inline-block;margin-top:1rem;color:#24483f;text-underline-offset:4px}
      .boot-mark{display:grid;place-items:center;width:44px;height:44px;background:#193a35;color:#e6bd74;border-radius:8px;font:bold 24px Georgia,serif}
      #startup-details{white-space:pre-wrap;overflow-wrap:anywhere}
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup" aria-live="polite" data-testid="startup-fallback">
        <div class="boot-mark" aria-hidden="true">F</div><h1>FDX Atelier</h1>
        <p id="startup-message">Ouverture de l’atelier…</p>
        <p>Votre source reste intacte. Aucun fichier n’est transmis.</p>
        <details id="startup-error" hidden><summary>Détails du démarrage</summary><pre id="startup-details"></pre></details>
        <a href="">Recharger l’atelier</a>
        <noscript><p>JavaScript est nécessaire pour ouvrir l’atelier. Activez-le puis rechargez cette page.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
