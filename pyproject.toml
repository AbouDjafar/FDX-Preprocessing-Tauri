[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fdx-atelier"
version = "1.0.0"
description = "Atelier Windows de preparation et de validation de donnees Excel"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7", "openpyxl>=3.1.5,<4", "pydantic>=2.10,<3",
  "pandera[pandas]>=0.26,<1", "rapidfuzz>=3.10,<4", "phonenumbers>=9,<10",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "hypothesis>=6,<7", "ruff>=0.11,<1"]
build = ["nuitka>=2.7", "ordered-set", "zstandard", "pefile", "pyinstaller>=6.15,<7"]

[project.scripts]
fdx-atelier = "fdx_atelier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

