name: Inspect synthetic Windows test diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Windows verification run to inspect
        required: false
      probe_native:
        description: Test the cached application with the current native test harness
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    if: ${{ !inputs.probe_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read driver diagnostics on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'windows-verification-*' --dir diagnostics
          python - <<'PY'
          from pathlib import Path
          logs = list(Path('diagnostics').rglob('driver.log'))
          if not logs:
              raise SystemExit('No driver log in this synthetic verification run')
          for path in logs:
              print(path.read_text(encoding='utf-8', errors='replace')[-30000:])
          PY
  probe:
    if: inputs.probe_native
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/oracle-requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: target/release
          key: windows-release-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-release-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
          fail-on-cache-miss: true
      - name: Diagnose the cached native application
        timeout-minutes: 6
        run: |
          Write-Output 'Diagnostic only. Release qualification still requires the full Windows workflow.'
          pip install -r scripts/oracle-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/edge_driver.py qa/driver
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/native_smoke.py target/release/fdx-atelier-tauri.exe qa/driver/msedgedriver.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-probe-diagnostics
          path: qa/native/
