name: FDX Atelier Windows build and native verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-tauri-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/oracle-requirements.txt
      - name: Release metadata and synthetic promotion checks
        run: |
          python scripts/promote_tauri.py --check-manifests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts/tests -p 'test_tauri_release.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install frontend dependencies on runner
        run: npm ci
        working-directory: web
      - name: Frontend validation
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        working-directory: web
      - name: Build assets and install CI-only oracle
        run: |
          python scripts/tauri_icon.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pip install -r scripts/oracle-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/tauri_notices.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust Windows tests and lint
        run: |
          cargo test --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@v4
        id: release_cache
        with:
          path: target/release
          key: windows-release-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-release-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
            windows-release-${{ runner.arch }}-
      - name: Build release and NSIS installer
        working-directory: src-tauri
        run: |
          # A restored dependency cache may include an installer from an older commit.
          $nsis = Join-Path $env:GITHUB_WORKSPACE 'target\release\bundle\nsis'
          if (Test-Path -LiteralPath $nsis) {
            Get-ChildItem -LiteralPath $nsis -Filter '*.exe' -File | Remove-Item -Force
          }
          ..\web\node_modules\.bin\tauri.cmd build --ci -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build verification CLI
        run: cargo build --locked --release -p fdx-cli
      - uses: actions/cache/save@v4
        if: steps.release_cache.outputs.cache-hit != 'true'
        with:
          path: target/release
          key: ${{ steps.release_cache.outputs.cache-primary-key }}
      - name: Independent conservation checks
        run: |
          python scripts/compare_engines.py target/release/fdx-cli.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install WebDriver on runner
        run: |
          python scripts/edge_driver.py qa/driver
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, verify and uninstall on runner
        timeout-minutes: 5
        run: .\scripts\verify_tauri_windows.ps1
      - name: Native application end-to-end
        timeout-minutes: 6
        run: python scripts/native_smoke.py target/release/fdx-atelier-tauri.exe qa/driver/msedgedriver.exe
      - name: Frontend visual scenarios
        working-directory: web
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package verified assets without rebuilding
        run: .\scripts\package_tauri.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verified-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots-${{ github.sha }}
          path: qa/native/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification-${{ github.sha }}
          path: |
            qa/
            web/test-results/
            web/playwright-report/
