name: Windows Tauri build and native verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-tauri-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/oracle-requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install frontend dependencies on runner
        run: npm ci
        working-directory: web
      - name: Frontend validation
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        working-directory: web
      - name: Build assets and install CI-only oracle
        run: |
          python scripts/tauri_icon.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pip install -r scripts/oracle-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/tauri_notices.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust Windows tests and lint
        run: |
          cargo test --locked --workspace
          $testsFailed = $LASTEXITCODE
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -or $testsFailed) { exit 1 }
      - name: Build release and NSIS installer
        working-directory: src-tauri
        run: |
          ..\web\node_modules\.bin\tauri.cmd build --ci -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build CLI and run independent conservation checks
        run: |
          cargo build --locked --release -p fdx-cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/compare_engines.py target/release/fdx-cli.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install WebDriver on runner
        run: |
          cargo install tauri-driver --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/edge_driver.py qa/driver
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native application end-to-end
        run: python scripts/native_smoke.py target/release/fdx-atelier-tauri.exe qa/driver/msedgedriver.exe
      - name: Frontend visual scenarios
        working-directory: web
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, verify and uninstall on runner
        run: .\scripts\verify_tauri_windows.ps1
      - name: Package verified assets without rebuilding
        run: .\scripts\package_tauri.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verified-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification-${{ github.sha }}
          path: |
            qa/
            web/test-results/
            web/playwright-report/
