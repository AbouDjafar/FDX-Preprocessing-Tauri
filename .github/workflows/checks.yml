name: Rust and React checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'legacy/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/oracle-requirements.txt
      - name: Release metadata and synthetic promotion checks
        run: |
          python scripts/promote_tauri.py --check-manifests
          python -m unittest discover -s scripts/tests -p 'test_tauri_release.py' -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        id: formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Core and CLI tests
        run: cargo test --locked -p fdx-core -p fdx-cli
      - name: Core and CLI lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p fdx-core -p fdx-cli --all-targets -- -D warnings
      - name: Native CLI self-test
        run: cargo run --locked -p fdx-cli -- selftest --output qa/selftest.json --scale 10000
      - name: Reference engine and independent Excel checks
        env:
          PYTHONPATH: src
        run: |
          pip install -r scripts/oracle-requirements.txt
          pytest -q tests/test_dictionary_transforms.py tests/test_engine_export.py tests/test_regressions.py tests/test_storage.py
          python scripts/compare_engines.py target/debug/fdx-cli
      - name: Enforce formatting
        if: steps.formatting.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-verification
          path: qa/*.json
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Dependency security gate
        run: npm audit --audit-level=high
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-verification
          path: |
            web/test-results/
            web/playwright-report/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots-${{ github.sha }}
          path: |
            web/test-results/**/home.png
            web/test-results/**/review-initial.png
            web/test-results/**/export-demo.png
            web/test-results/**/test-failed-1.png
