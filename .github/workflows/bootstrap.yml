name: Resolve dependencies on GitHub
on:
  workflow_dispatch:
    inputs:
      format_rust:
        description: Format Rust sources after implementation
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: lockfiles
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate lockfiles remotely
        run: |
          npm --prefix web install --package-lock-only --ignore-scripts
          cargo generate-lockfile
      - name: Format Rust remotely
        if: inputs.format_rust
        run: cargo fmt --all
      - name: Commit small source metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock web/package-lock.json
          if [ '${{ inputs.format_rust }}' = 'true' ]; then git add 'crates/**/*.rs' 'src-tauri/**/*.rs'; fi
          if ! git diff --cached --quiet; then git commit -m 'Lock dependencies and normalize sources using Actions [skip ci]'; git push origin HEAD:main; fi
      - name: Compiler provenance
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
